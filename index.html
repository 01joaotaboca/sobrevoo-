<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#10231c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Sobrevoo">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Sobrevoo</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@500;600;700&display=swap">
<style>
:root{--bg:#10231c;--panel:#1e3a2f;--ink:#f1f5ee;--track:#ffc933}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--bg);color:var(--ink);font:600 15px/1.3 Barlow,system-ui,sans-serif}
#map,#hud{position:absolute;inset:0;width:100%;height:100%}
#hud{pointer-events:none}
#bar{position:absolute;left:0;right:0;bottom:0;display:flex;gap:8px;flex-wrap:wrap;padding:40px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(16,35,28,.94) 45%)}
button,label.b{flex:1 1 42%;min-height:44px;border:0;border-radius:10px;background:var(--panel);color:var(--ink);font:inherit;display:flex;align-items:center;justify-content:center;cursor:pointer}
button:focus-visible,label.b:focus-within{outline:3px solid var(--track);outline-offset:2px}
button.p{background:var(--track);color:#2a2100}
button.r{background:#b5432a}
button:disabled{opacity:.4;cursor:default}
#msg{position:absolute;left:16px;right:16px;bottom:calc(210px + env(safe-area-inset-bottom));text-align:center;font-size:16px;text-shadow:0 1px 6px #000;pointer-events:none}
input{display:none}
#lnks{position:absolute;left:12px;top:calc(40% + 14px);display:none}
#lnks a{display:block;min-width:200px;padding:0 8px;font:600 19px/28px Barlow,sans-serif;color:transparent;text-decoration:none}
.maplibregl-ctrl-bottom-right{bottom:210px}
#bar2{position:absolute;left:0;right:0;bottom:0;display:none;gap:8px;flex-wrap:wrap;padding:40px 12px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(16,35,28,.94) 45%)}
body.draw #bar{display:none}
body.draw #bar2{display:flex}
#bDone{flex:1 1 100%}
#panel{position:absolute;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));max-height:70%;overflow:auto;display:none;flex-direction:column;gap:8px;padding:14px;border-radius:14px;background:rgba(16,35,28,.96)}
#panel h3{margin:0 0 4px;font-size:18px}
#panel p{margin:0}
#panel .it{display:flex;gap:6px}
#panel .it button{flex:0 0 auto;min-width:70px;min-height:44px}
#panel .it button:first-child{flex:1 1 auto;justify-content:flex-start;padding:0 12px;text-align:left}
</style>
</head>
<body>
<div id="map"></div>
<canvas id="hud"></canvas>
<div id="lnks"></div>
<div id="msg"></div>
<div id="bar">
  <button id="bRec">Gravar GPS</button>
  <label class="b">Abrir GPX, KML ou KMZ<input id="file" type="file" accept=".gpx,.kml,.kmz"></label>
  <button id="bPlay" class="p" disabled>Replay</button>
  <button id="bExp" disabled>Exportar vídeo</button>
  <button id="bDraw">Desenhar área</button>
  <button id="bAreas">Áreas salvas</button>
</div>
<div id="bar2">
  <button id="bUndo">Desfazer ponto</button>
  <button id="bCancel">Cancelar</button>
  <button id="bDone" class="p">Concluir e salvar</button>
</div>
<div id="panel"></div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<script>
const $ = s => document.querySelector(s);
const EMPTY = {type:'FeatureCollection',features:[]};
const DUR = 28000, INTRO = 3800, OUTRO = 5000;
const CREDITO = 'Aplicativo Agro desenvolvido por João Divino';
// Links que aparecem no fim do vídeo (um por linha). Se ficar vazio, usa o endereço desta própria página quando hospedada.
const LINKS = ['aplicativos-one.vercel.app'];
const linksFim = () => LINKS.length ? LINKS
  : (/^https?:/.test(location.protocol) ? [location.host + location.pathname.replace(/index\.html$/,'')] : []);
$('#lnks').innerHTML = linksFim().map(l=>`<a href="${/^https?:/.test(l)?l:'https://'+l}" target="_blank" rel="noopener">${l}</a>`).join('');
let pts = [], D = [], T = [], G = [];
let name = 'Percurso', dateTxt = '';
let playing = false, prog = 0, bear = 0, last = 0, introEnd = 0, showEnd = false;
let watchId = null, wake = null, exp = null, ex = null;
let cam = {z:15,p:55}; // câmera de acompanhamento: calculada pelo tamanho do percurso
let ov = {c:[0,0],z:12}; // câmera de visão geral (de cima, mostrando a área inteira)
let outroStart = 0;

/* ---------- mapa ---------- */
const map = new maplibregl.Map({
  container:'map',
  preserveDrawingBuffer:true,
  pixelRatio:Math.min(devicePixelRatio||1,2),
  center:[-52,-15], zoom:4, maxPitch:75,
  style:{version:8,
    sources:{
      sat:{type:'raster',tileSize:256,maxzoom:18,attribution:'Imagens: Esri',
        tiles:['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}']},
      dem:{type:'raster-dem',encoding:'terrarium',tileSize:256,maxzoom:14,
        tiles:['https://s3.amazonaws.com/elevation-tiles-prod/terrarium/{z}/{x}/{y}.png']},
      area:{type:'geojson',data:EMPTY},
      ghost:{type:'geojson',data:EMPTY},
      trk:{type:'geojson',data:EMPTY},
      dot:{type:'geojson',data:EMPTY}},
    layers:[
      {id:'sat',type:'raster',source:'sat'},
      {id:'area',type:'fill',source:'area',paint:{'fill-color':'#ffc933','fill-opacity':.22}},
      {id:'ghost',type:'line',source:'ghost',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#fff','line-width':3,'line-opacity':.8}},
      {id:'casing',type:'line',source:'trk',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#fff','line-width':9,'line-opacity':.85}},
      {id:'line',type:'line',source:'trk',layout:{'line-cap':'round','line-join':'round'},paint:{'line-color':'#ffc933','line-width':5}},
      {id:'dot',type:'circle',source:'dot',paint:{'circle-radius':8,'circle-color':'#ffc933','circle-stroke-color':'#fff','circle-stroke-width':3}}],
    terrain:{source:'dem',exaggeration:1.3}}
});
map.addControl(new maplibregl.AttributionControl({compact:true}),'bottom-right');
map.on('error',e=>{console.error(e.error||e);const t=String(e.error&&e.error.message||'');
  if(!map.isStyleLoaded()&&!map.getSource('trk')) msg('Erro ao carregar o mapa: '+t.slice(0,80),8000);});

/* ---------- geometria ---------- */
const R = Math.PI/180;
const hav = (a,b) => { const x=(b[0]-a[0])*R, y=(b[1]-a[1])*R,
  s=Math.sin(y/2)**2+Math.cos(a[1]*R)*Math.cos(b[1]*R)*Math.sin(x/2)**2; return 12742000*Math.asin(Math.sqrt(s)); };
const brg = (a,b) => { const dx=(b[0]-a[0])*R, y=Math.sin(dx)*Math.cos(b[1]*R),
  x=Math.cos(a[1]*R)*Math.sin(b[1]*R)-Math.sin(a[1]*R)*Math.cos(b[1]*R)*Math.cos(dx); return Math.atan2(y,x)/R; };
const hms = s => [s/3600|0,(s/60|0)%60,s%60|0].map(n=>String(n).padStart(2,'0')).join(':');
const km = m => (m/1000).toFixed(2).replace('.',',');

function calc(){
  D=[0]; G=[0]; const t0=pts[0]?.[3];
  T=[t0!=null?0:null];
  for(let i=1;i<pts.length;i++){
    D[i]=D[i-1]+hav(pts[i-1],pts[i]);
    T[i]=(t0!=null&&pts[i][3]!=null)?pts[i][3]-t0:null;
    const de=(pts[i][2]||0)-(pts[i-1][2]||0);
    G[i]=G[i-1]+(de>.5?de:0);
  }
}
function at(f){
  if(pts.length<2) return {i:0,p:pts[0]||[0,0],d:0,t:null,g:0};
  const d=f*D[D.length-1]; let lo=0,hi=D.length-1;
  while(hi-lo>1){const m=(lo+hi)>>1; D[m]<=d?lo=m:hi=m;}
  const u=(d-D[lo])/((D[hi]-D[lo])||1), L=(a,b)=>a+(b-a)*u;
  return {i:lo,d,p:[L(pts[lo][0],pts[hi][0]),L(pts[lo][1],pts[hi][1])],
    t:T[lo]==null||T[hi]==null?null:L(T[lo],T[hi]),g:L(G[lo],G[hi])};
}
const lineOf = a => ({type:'Feature',geometry:{type:'LineString',
  coordinates:pts.slice(0,a.i+1).map(p=>[p[0],p[1]]).concat([a.p])}});

/* ---------- desenho de cada quadro ---------- */
function frame(f,k=1){ // k: 0 = visão geral de cima, 1 = câmera inclinada seguindo o percurso
  const a=at(f);
  map.getSource('trk').setData(lineOf(a));
  map.getSource('dot').setData({type:'Feature',geometry:{type:'Point',coordinates:a.p}});
  const s=k*k*(3-2*k); // helicóptero: gira 360° em torno do centro da área, sem seguir o contorno
  map.jumpTo({center:ov.c,bearing:360*f,pitch:cam.p*s,zoom:ov.z+(cam.z-ov.z)*s});
  hud(a,f);
}
let lastH=null, isClosed=false;
function overlay(x,a){ // desenha por cima do mapa; aparece igual na tela e no vídeo exportado
  const P=q=>{const o=map.project([q[0],q[1]]);return [o.x,o.y];};
  const path=(arr,close)=>{x.beginPath();arr.forEach((q,i)=>{const [X,Y]=P(q);i?x.lineTo(X,Y):x.moveTo(X,Y);});if(close)x.closePath();};
  const bolinha=q=>{const [X,Y]=P(q);x.beginPath();x.arc(X,Y,8,0,7);x.fillStyle='#ffc933';x.fill();x.strokeStyle='#fff';x.lineWidth=3;x.stroke();};
  x.save(); x.shadowBlur=0; x.lineJoin='round'; x.lineCap='round';
  if(drawing){
    if(draft.length>2){path(draft,true);x.fillStyle='rgba(255,201,51,.25)';x.fill();}
    if(draft.length>1){path(draft,draft.length>2);x.strokeStyle='#fff';x.lineWidth=3;x.stroke();}
    draft.forEach(bolinha);
  } else if(pts.length>1){
    if(isClosed){path(pts,true);x.fillStyle='rgba(255,201,51,.22)';x.fill();}
    path(pts,false);x.strokeStyle='rgba(255,255,255,.8)';x.lineWidth=3;x.stroke();
    const part=pts.slice(0,a.i+1).concat([a.p]);
    path(part,false);x.strokeStyle='rgba(255,255,255,.85)';x.lineWidth=9;x.stroke();
    path(part,false);x.strokeStyle='#ffc933';x.lineWidth=5;x.stroke();
    bolinha(a.p);
  }
  x.restore();
}
function hud(a,f){
  const c=$('#hud'), m=map.getCanvas();
  if(c.width!==m.width||c.height!==m.height){c.width=m.width;c.height=m.height;}
  const x=c.getContext('2d'), k=m.width/m.clientWidth, w=m.clientWidth, h=m.clientHeight;
  x.setTransform(k,0,0,k,0,0); x.clearRect(0,0,w,h);
  lastH=[a,f]; overlay(x,a);
  x.shadowColor='rgba(0,0,0,.65)'; x.shadowBlur=8; x.fillStyle='#fff'; x.textAlign='left';
  if(!pts.length||drawing) return;
  x.fillStyle='#ffc933'; x.fillRect(0,0,w*f,4); x.fillStyle='#fff';
  if(showEnd){
    x.font='700 24px Barlow,sans-serif'; x.fillText(CREDITO,20,h*.4,w-40);
    x.font='600 19px Barlow,sans-serif'; x.fillStyle='#ffc933';
    linksFim().forEach((l,i)=>x.fillText(l,20,h*.4+36+i*28,w-40));
  }
  x.textAlign='right'; x.font='500 12px Barlow,sans-serif'; x.fillText('Sobrevoo · Imagens: Esri',w-12,22);
}

/* ---------- loop ---------- */
function tick(ts){
  const now=performance.now();
  if(playing){
    if(now<introEnd) frame(0,(now-introEnd+INTRO)/INTRO); // abertura: desce da visão geral
    else{
      prog+=(last?ts-last:0)/DUR; last=ts;
      if(prog>=1){prog=1;playing=false;showEnd=true;outroStart=now;ui(); if(exp) setTimeout(stopExp,OUTRO+500);}
      frame(prog,1);
    }
  } else {
    last=0;
    if(outroStart){ // encerramento: sobe de volta para a visão geral
      const u=(now-outroStart)/OUTRO; frame(1,Math.max(0,1-u)); if(u>=1) outroStart=0;
    }
  }
  $('#lnks').style.display=showEnd?'block':'none';
  if(exp&&ex){ex.x.drawImage(map.getCanvas(),0,0);ex.x.drawImage($('#hud'),0,0,ex.c.width,ex.c.height);}
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

function play(){
  if(pts.length<2) return;
  if(prog>=1||showEnd) prog=0;
  showEnd=false; outroStart=0; playing=true; last=0; bear=brg(pts[0],pts[Math.min(pts.length-1,5)]);
  introEnd=performance.now()+INTRO; ui();
}
function pause(){playing=false; ui();}

/* ---------- carregar percurso ---------- */
function setTrack(p,n,t){
  pts=p; calc(); name=n; prog=0; showEnd=false; playing=false;
  dateTxt=(t||pts[0]?.[3])?new Date((t||pts[0][3])*1000).toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'}):'';
  const a=at(1);
  map.getSource('trk').setData(lineOf(a)); map.getSource('dot').setData(EMPTY);
  const b=new maplibregl.LngLatBounds(); pts.forEach(q=>b.extend([q[0],q[1]]));
  const diag=hav([b.getWest(),b.getSouth()],[b.getEast(),b.getNorth()]);
  const W=Math.max(500,diag*1.8); // terreno visível na tela durante a órbita (a diagonal cabe em qualquer ângulo)
  const cf=map.cameraForBounds(b,{padding:{top:110,bottom:290,left:50,right:50},maxZoom:17});
  ov={c:[b.getCenter().lng,b.getCenter().lat],z:cf?cf.zoom:12};
  cam.z=Math.min(17.5,Math.log2(156543*Math.cos(b.getCenter().lat*R)*innerWidth/W)); cam.p=50;
  const ring=pts.map(q=>[q[0],q[1]]), closed=hav(pts[0],pts[pts.length-1])<Math.max(50,diag*.05);
  isClosed=closed;
  map.getSource('ghost').setData({type:'Feature',geometry:{type:'LineString',coordinates:ring}});
  map.getSource('area').setData(closed?{type:'Feature',geometry:{type:'Polygon',coordinates:[ring.concat([ring[0]])]}}:EMPTY);
  map.easeTo({center:ov.c,zoom:ov.z,pitch:0,bearing:0,duration:1200});
  hud(a,0); msg(''); ui();
}
function parse(text,fname){
  const doc=new DOMParser().parseFromString(text,'text/xml'); let p=[];
  const tps=[...doc.querySelectorAll('trkpt')], rps=[...doc.querySelectorAll('rtept')];
  if(tps.length||rps.length){
    p=(tps.length?tps:rps).map(e=>{
      const t=e.querySelector('time')?.textContent, z=e.querySelector('ele')?.textContent;
      return [+e.getAttribute('lon'),+e.getAttribute('lat'),z!=null?+z:0,t?Date.parse(t)/1000:null];
    });
  } else {
    let cs=[...doc.querySelectorAll('LineString coordinates')]; if(!cs.length) cs=[...doc.querySelectorAll('coordinates')];
    let best=[];
    cs.forEach(e=>{const l=e.textContent.trim().split(/\s+/).map(s=>s.split(',').map(Number)).filter(q=>q.length>=2&&!isNaN(q[0])&&!isNaN(q[1]));
      if(l.length>best.length) best=l;});
    p=best.map(q=>[q[0],q[1],q[2]||0,null]);
  }
  p=p.filter(q=>!isNaN(q[0])&&!isNaN(q[1]));
  if(p.length<2) return msg('Não encontrei um percurso nesse arquivo.',4000);
  const n=doc.querySelector('trk > name, Document > name, Placemark > name')?.textContent?.trim()||fname.replace(/\.[^.]+$/,'');
  setTrack(p,n);
}
$('#file').onchange=async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    if(/\.kmz$/i.test(f.name)){
      const z=await JSZip.loadAsync(await f.arrayBuffer());
      const k=Object.keys(z.files).find(n=>/\.kml$/i.test(n));
      if(!k) throw 0; parse(await z.files[k].async('string'),f.name);
    } else parse(await f.text(),f.name);
  }catch(err){console.error(err);msg('Não consegui ler esse arquivo: '+(err&&err.message||'formato inválido'),6000);}
  e.target.value='';
};

/* ---------- gravação ao vivo ---------- */
async function startRec(){
  if(!navigator.geolocation) return msg('Este aparelho não tem GPS disponível.',4000);
  pause(); pts=[]; D=[0];T=[null];G=[0]; name='Gravação'; showEnd=false; outroStart=0; isClosed=false;
  map.getSource('ghost').setData(EMPTY); map.getSource('area').setData(EMPTY);
  dateTxt=new Date().toLocaleDateString('pt-BR',{day:'numeric',month:'long',year:'numeric'});
  try{wake=await navigator.wakeLock?.request('screen');}catch(e){}
  msg('Procurando sinal de GPS…');
  watchId=navigator.geolocation.watchPosition(pos=>{
    const c=pos.coords; if(c.accuracy>35) return;
    const p=[c.longitude,c.latitude,c.altitude||0,pos.timestamp/1000], l=pts[pts.length-1];
    if(l&&hav(l,p)<3) return;
    pts.push(p); calc(); msg('');
    map.getSource('trk').setData(lineOf(at(1)));
    map.getSource('dot').setData({type:'Feature',geometry:{type:'Point',coordinates:p}});
    map.easeTo({center:p,zoom:17,pitch:0,bearing:0,duration:700});
    hud(at(1),0);
    try{localStorage.setItem('sv_rec',JSON.stringify(pts));}catch(e){}
  },err=>msg('GPS indisponível: permita a localização no navegador.',5000),
  {enableHighAccuracy:true,maximumAge:0,timeout:20000});
  ui();
}
function stopRec(){
  navigator.geolocation.clearWatch(watchId); watchId=null; wake?.release?.(); wake=null;
  if(pts.length<2){pts=[];msg('Gravação muito curta para gerar o replay.',4000);ui();return;}
  const p=pts; setTrack(p,'Gravação de '+new Date(p[0][3]*1000).toLocaleDateString('pt-BR'));
}

/* ---------- exportar vídeo ---------- */
/* Reescreve o MP4 fragmentado do MediaRecorder como MP4 normal (com duração) */
function remuxMp4(ab){
  const u8=new Uint8Array(ab), dv=new DataView(ab);
  const t4=(o)=>String.fromCharCode(u8[o],u8[o+1],u8[o+2],u8[o+3]);
  const rd=(s,e)=>{const a=[];for(let o=s;o+8<=e;){let sz=dv.getUint32(o),ty=t4(o+4),h=8;if(sz===1){sz=Number(dv.getBigUint64(o+8));h=16;}else if(sz===0)sz=e-o;if(sz<h||o+sz>e)break;a.push({ty,s:o,e:o+sz,b:o+h});o+=sz;}return a;};
  const top=rd(0,u8.length);
  const ftyp=top.find(x=>x.ty==='ftyp'), moov=top.find(x=>x.ty==='moov');
  if(!moov) throw new Error('sem moov');
  const find=(p,ty)=>rd(p.b,p.e).find(x=>x.ty===ty);
  const trak=find(moov,'trak'), mdia=find(trak,'mdia'), minf=find(mdia,'minf'), stbl=find(minf,'stbl');
  const mdhd=find(mdia,'mdhd'), mdhdV=u8[mdhd.b];
  const ts=dv.getUint32(mdhd.b+(mdhdV===1?20:12));
  // amostras das moofs
  const S=[];
  for(let i=0;i<top.length;i++){
    if(top[i].ty!=='moof') continue;
    const moof=top[i];
    for(const traf of rd(moof.b,moof.e).filter(x=>x.ty==='traf')){
      const tfhd=find(traf,'tfhd'), tf=dv.getUint32(tfhd.b)&0xffffff; let o=tfhd.b+8;
      let base=moof.s; if(tf&1){base=Number(dv.getBigUint64(o));o+=8;}
      if(tf&2)o+=4; let dd=0,ds=0,dfl=0;
      if(tf&8){dd=dv.getUint32(o);o+=4;} if(tf&0x10){ds=dv.getUint32(o);o+=4;} if(tf&0x20){dfl=dv.getUint32(o);o+=4;}
      for(const trun of rd(traf.b,traf.e).filter(x=>x.ty==='trun')){
        const fl=dv.getUint32(trun.b)&0xffffff, n=dv.getUint32(trun.b+4); let p=trun.b+8, off=base;
        if(fl&1){off=base+dv.getInt32(p);p+=4;}
        let ffl=null; if(fl&4){ffl=dv.getUint32(p);p+=4;}
        for(let k=0;k<n;k++){
          let d=dd,sz=ds,f=dfl;
          if(fl&0x100){d=dv.getUint32(p);p+=4;} if(fl&0x200){sz=dv.getUint32(p);p+=4;}
          if(fl&0x400){f=dv.getUint32(p);p+=4;} else if(k===0&&ffl!==null) f=ffl;
          if(fl&0x800)p+=4;
          S.push({off,sz,d,sync:!(f&0x10000)}); off+=sz;
        }
      }
    }
  }
  if(!S.length) throw new Error('sem amostras');
  const total=S.reduce((a,s)=>a+s.d,0), mvTs=1000, movDur=Math.round(total*mvTs/ts);
  const w32=(n)=>[(n>>>24)&255,(n>>>16)&255,(n>>>8)&255,n&255];
  const str=(s)=>[...s].map(c=>c.charCodeAt(0));
  const box=(ty,...parts)=>{const body=[].concat(...parts.map(p=>Array.from(p)));return Uint8Array.from([...w32(body.length+8),...str(ty),...body]);};
  const full=(ty,fl,...parts)=>box(ty,[0,(fl>>16)&255,(fl>>8)&255,fl&255],...parts);
  // stts
  const runs=[];for(const s of S){const r=runs[runs.length-1];if(r&&r.d===s.d)r.c++;else runs.push({c:1,d:s.d});}
  const stts=full('stts',0,w32(runs.length),...runs.map(r=>[...w32(r.c),...w32(r.d)]));
  const stsc=full('stsc',0,w32(1),w32(1),w32(S.length),w32(1));
  const szs=new Uint8Array(12+S.length*4); const szv=new DataView(szs.buffer); szv.setUint32(8,S.length); S.forEach((s,i)=>szv.setUint32(12+i*4,s.sz));
  const stsz=box('stsz',[0,0,0,0],szs.subarray(0,0),szs.subarray(4)); // versão/flags + sample_size(0) + count + tabela
  const sync=[];S.forEach((s,i)=>{if(s.sync)sync.push(i+1);});
  const stss=full('stss',0,w32(sync.length),...sync.map(w32));
  const mk=(off)=>full('stco',0,w32(1),w32(off));
  const stsd=find(stbl,'stsd'), stsdB=u8.slice(stsd.s,stsd.e);
  const setDurBox=(b,ty)=>{ // devolve cópia da caixa com a duração ajustada
    const c=u8.slice(b.s,b.e), v=new DataView(c.buffer), ver=c[8];
    if(ty==='mvhd'){ if(ver===1){v.setBigUint64(8+4+8+8+4,BigInt(movDur));} else v.setUint32(8+4+4+4+4,movDur);}
    else if(ty==='tkhd'){ if(ver===1)v.setBigUint64(8+4+8+8+4+4,BigInt(movDur)); else v.setUint32(8+4+4+4+4+4,movDur);}
    else if(ty==='mdhd'){ if(ver===1)v.setBigUint64(8+4+8+8+4,BigInt(total)); else v.setUint32(8+4+4+4+4,total);}
    return c;
  };
  const cp=(b)=>u8.slice(b.s,b.e);
  const build=(off)=>{
    const stblN=box('stbl',stsdB,stts,stss,stsc,stsz,mk(off));
    const minfN=box('minf',...rd(minf.b,minf.e).filter(x=>x.ty!=='stbl').map(cp),stblN);
    const mdiaN=box('mdia',...rd(mdia.b,mdia.e).map(x=>x.ty==='minf'?minfN:x.ty==='mdhd'?setDurBox(x,'mdhd'):cp(x)));
    const trakN=box('trak',...rd(trak.b,trak.e).map(x=>x.ty==='mdia'?mdiaN:x.ty==='tkhd'?setDurBox(x,'tkhd'):cp(x)));
    return box('moov',...rd(moov.b,moov.e).filter(x=>x.ty!=='mvex').map(x=>x.ty==='trak'?trakN:x.ty==='mvhd'?setDurBox(x,'mvhd'):cp(x)));
  };
  const ftypB=ftyp?cp(ftyp):box('ftyp',str('isom'),[0,0,2,0],str('isomiso2avc1mp41'));
  const dataSize=S.reduce((a,s)=>a+s.sz,0);
  let moovB=build(0); moovB=build(ftypB.length+moovB.length+8);
  const out=new Uint8Array(ftypB.length+moovB.length+8+dataSize);
  out.set(ftypB,0); out.set(moovB,ftypB.length);
  let p=ftypB.length+moovB.length; new DataView(out.buffer).setUint32(p,dataSize+8); out.set(str('mdat'),p+4); p+=8;
  for(const s of S){out.set(u8.subarray(s.off,s.off+s.sz),p);p+=s.sz;}
  return out;
}

function startExp(){
  if(pts.length<2||typeof MediaRecorder==='undefined') return msg('Este navegador não exporta vídeo.',4000);
  const m=map.getCanvas(), c=document.createElement('canvas'); c.width=m.width; c.height=m.height;
  ex={c,x:c.getContext('2d')};
  const mt=['video/mp4;codecs=avc1','video/webm;codecs=vp9','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
  const mr=new MediaRecorder(c.captureStream(30),{mimeType:mt,videoBitsPerSecond:8e6}), ch=[];
  mr.ondataavailable=e=>e.data.size&&ch.push(e.data);
  mr.onstop=async()=>{
    let blob=new Blob(ch,{type:mt});
    if(mt.includes('mp4')){ try{ blob=new Blob([remuxMp4(await blob.arrayBuffer())],{type:'video/mp4'}); }catch(e){} } // corrige a duração do arquivo
    const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='sobrevoo.'+(mt.includes('mp4')?'mp4':'webm'); a.click();
    exp=null; ex=null; ui(); msg('Vídeo salvo.',3000);
  };
  exp=mr; mr.start(500); prog=0; play(); msg('Gravando o vídeo… aguarde o fim do replay.');
}
function stopExp(){ if(exp&&exp.state!=='inactive') exp.stop(); }

/* ---------- interface ---------- */
function msg(t,ms){const e=$('#msg'); e.textContent=t; if(ms) setTimeout(()=>{if(e.textContent===t)e.textContent='';},ms);}
function ui(){
  const rec=watchId!=null, has=pts.length>1&&!rec;
  $('#bRec').textContent=rec?'Parar gravação':'Gravar GPS';
  $('#bRec').className=rec?'r':'';
  $('#bRec').disabled=!!exp;
  $('#bPlay').textContent=playing?'Pausar':'Replay';
  $('#bPlay').disabled=!has||!!exp;
  $('#bExp').disabled=!has||!!exp;
  $('#file').disabled=rec||!!exp;
  $('#bDraw').disabled=rec||!!exp;
  $('#bAreas').disabled=rec||!!exp;
}
$('#bRec').onclick=()=>watchId!=null?stopRec():startRec();
$('#bPlay').onclick=()=>playing?pause():play();
$('#bExp').onclick=startExp;

/* ---------- desenhar área tocando no mapa + áreas salvas ---------- */
let drawing=false, draft=[];
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const areas=()=>{try{return JSON.parse(localStorage.getItem('sv_areas')||'[]');}catch(e){return [];}};
function saveAreas(l){try{localStorage.setItem('sv_areas',JSON.stringify(l.slice(0,50)));return true;}catch(e){msg('Não consegui salvar neste navegador.',4000);return false;}}
function drawDraft(){
  const n=draft.length, S=(id,d)=>map.getSource(id).setData(d), ring=draft.concat([draft[0]]);
  S('trk',EMPTY); S('dot',n?{type:'Feature',geometry:{type:'MultiPoint',coordinates:draft}}:EMPTY);
  S('ghost',n>1?{type:'Feature',geometry:{type:'LineString',coordinates:n>2?ring:draft}}:EMPTY);
  S('area',n>2?{type:'Feature',geometry:{type:'Polygon',coordinates:[ring]}}:EMPTY);
  hud(at(0),0);
}
function startDraw(){
  playing=false; outroStart=0; showEnd=false; drawing=true; draft=[];
  document.body.classList.add('draw'); map.easeTo({pitch:0,bearing:0,duration:600});
  drawDraft(); hud(at(0),0); msg('Toque no mapa para marcar os pontos da área.'); ui();
}
function exitDraw(){drawing=false; draft=[]; document.body.classList.remove('draw'); msg(''); ui();}
function cancelDraw(){exitDraw(); if(pts.length>1) setTrack(pts,name); else drawDraft();}
function doneDraw(){
  if(draft.length<3) return msg('Marque pelo menos 3 pontos.',3000);
  const n=(prompt('Nome da área:','Área '+new Date().toLocaleDateString('pt-BR'))||'').trim();
  if(!n) return;
  const ring=draft.concat([draft[0]]), l=areas(); l.unshift({n,r:ring,t:Date.now()}); saveAreas(l);
  exitDraw(); setTrack(ring.map(q=>[q[0],q[1],0,null]),n,Date.now()/1000);
}
function listAreas(){
  const l=areas(), p=$('#panel');
  p.innerHTML='<h3>Áreas salvas</h3>'+(l.length?'':'<p>Nenhuma área salva ainda.</p>')
    +l.map((a,i)=>`<div class="it"><button data-o="${i}">${esc(a.n)}</button><button data-k="${i}">KML</button><button data-x="${i}">Excluir</button></div>`).join('')
    +'<button data-c>Fechar</button>';
  p.style.display='flex';
}
function baixarKml(a){
  const c=a.r.map(q=>q[0]+','+q[1]+',0').join(' ');
  const s=`<?xml version="1.0" encoding="UTF-8"?><kml xmlns="http://www.opengis.net/kml/2.2"><Placemark><name>${esc(a.n)}</name><Polygon><outerBoundaryIs><LinearRing><coordinates>${c}</coordinates></LinearRing></outerBoundaryIs></Polygon></Placemark></kml>`;
  const l=document.createElement('a'); l.href=URL.createObjectURL(new Blob([s],{type:'application/vnd.google-earth.kml+xml'}));
  l.download=a.n.replace(/[^\w\-]+/g,'_')+'.kml'; l.click();
}
$('#panel').onclick=e=>{
  const d=e.target.dataset, l=areas(); if(!d) return;
  if('c' in d) $('#panel').style.display='none';
  else if(d.o!=null){const a=l[d.o]; $('#panel').style.display='none'; setTrack(a.r.map(q=>[q[0],q[1],0,null]),a.n,a.t/1000);}
  else if(d.k!=null) baixarKml(l[d.k]);
  else if(d.x!=null){l.splice(d.x,1); saveAreas(l); listAreas();}
};
map.on('click',e=>{ if(!drawing) return; draft.push([e.lngLat.lng,e.lngLat.lat]); msg(''); drawDraft(); });
$('#bDraw').onclick=startDraw; $('#bAreas').onclick=listAreas;
$('#bUndo').onclick=()=>{draft.pop(); drawDraft();};
$('#bCancel').onclick=cancelDraw; $('#bDone').onclick=doneDraw;

map.on('move',()=>{ if(lastH&&!playing&&!outroStart) hud(lastH[0],lastH[1]); });
map.on('load',()=>{
  ['area','ghost','casing','line','dot'].forEach(id=>map.setLayoutProperty(id,'visibility','none'));
  try{
    const s=JSON.parse(localStorage.getItem('sv_rec')||'[]');
    if(s.length>1) setTrack(s,'Última gravação'); else msg('Grave um percurso ou abra um arquivo GPX, KML ou KMZ.');
  }catch(e){msg('Grave um percurso ou abra um arquivo GPX, KML ou KMZ.');}
  ui();
});

if('serviceWorker' in navigator && /^https?:/.test(location.protocol)) window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
</script>
